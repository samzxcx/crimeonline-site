<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202020">
  <title>&#8203;</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2">
  <style>
    :root {
      color-scheme: dark;
      --page: #202020;
      --panel: rgba(224, 224, 224, .105);
      --panel-hover: rgba(235, 235, 235, .14);
      --stroke: rgba(255, 255, 255, .11);
      --text: #f4f4f4;
      --muted: #c2c2c2;
      --quiet: #969696;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page); }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(228, 228, 228, .14), transparent 55%),
        linear-gradient(145deg, #292929, #191919 70%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      cursor: url("./cursor-dot.svg") 12 12, auto;
    }

    a, button { cursor: url("./cursor-dot.svg") 12 12, pointer; }
    button { font: inherit; }

    .profile-grid {
      width: min(1080px, calc(100% - 40px));
      min-height: 100svh;
      margin: 0 auto;
      padding: 24px 0;
      display: grid;
      align-content: center;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      perspective: 1200px;
    }

    body:not(.entered) .profile-grid {
      opacity: .72;
      filter: blur(16px);
      transform: scale(.99);
    }

    .profile-grid {
      transition: opacity .85s ease, filter .85s ease, transform .85s ease;
    }

    body.entered .profile-grid {
      opacity: 1;
      filter: none;
      transform: scale(1);
    }

    .profile-card {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --pointer-x: 50%;
      --pointer-y: 50%;
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 15px 23px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--stroke);
      border-radius: 27px;
      background: var(--panel);
      box-shadow: 0 18px 52px rgba(0, 0, 0, .18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform-style: preserve-3d;
      transition:
        transform .16s cubic-bezier(.2,.75,.25,1),
        border-color .24s ease,
        background .24s ease,
        box-shadow .28s ease;
    }

    .profile-card::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, .105), transparent 54%);
      content: "";
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .profile-card > * { position: relative; z-index: 1; }

    body.entered .profile-card {
      animation: profile-arrive .72s cubic-bezier(.2,.75,.25,1) both;
      animation-delay: var(--delay, 0ms);
    }

    @keyframes profile-arrive {
      from { opacity: 0; translate: 0 22px; }
      to { opacity: 1; translate: 0 0; }
    }

    @media (hover: hover) and (pointer: fine) {
      .profile-grid:has(.profile-card:hover) .profile-card:not(:hover) {
        opacity: .62;
        transform: scale(.96);
      }

      .profile-card:hover {
        z-index: 10;
        border-color: rgba(255, 255, 255, .3);
        background: var(--panel-hover);
        box-shadow: 0 30px 82px rgba(0, 0, 0, .38), 0 0 0 1px rgba(255, 255, 255, .06);
        transform: perspective(900px) translateY(-12px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) scale(1.16);
      }

      .profile-card:hover::before { opacity: 1; }

      .profile-card:hover .avatar {
        border-color: rgba(255, 255, 255, .45);
        box-shadow: 0 14px 36px rgba(0, 0, 0, .4);
        transform: translateZ(34px) scale(1.12);
      }

      .profile-card:hover .identity,
      .profile-card:hover .badges,
      .profile-card:hover .profile-location,
      .profile-card:hover .bio,
      .profile-card:hover .profile-links,
      .profile-card:hover .discord-profile { transform: translateZ(20px); }
    }

    .avatar {
      position: relative;
      width: 74px;
      height: 74px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 50%;
      background: #343434;
      color: #fff;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -.05em;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .25);
      transform: translateZ(16px);
      transition: transform .35s cubic-bezier(.2,.75,.25,1), border-color .3s ease, box-shadow .3s ease;
    }

    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-card:hover .avatar {
      border-color: rgba(255, 255, 255, .4);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .34);
      transform: translateZ(28px) scale(1.06);
    }

    .identity {
      max-width: 100%;
      margin-top: 6px;
      text-align: center;
      transform: translateZ(14px);
    }

    .identity h2 {
      max-width: 100%;
      margin: 0;
      overflow: hidden;
      color: #f5f5f5;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -.05em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .handle {
      margin-top: 4px;
      overflow: hidden;
      color: #b4b4b4;
      font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badges {
      min-height: 18px;
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      transform: translateZ(12px);
    }

    .badge {
      min-height: 18px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .065);
      color: #dedede;
      font: 8px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .profile-location {
      width: 100%;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #bdbdbd;
      font-size: 11px;
      line-height: 1.3;
      text-align: center;
      transform: translateZ(8px);
    }

    .location-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      color: #e4e4e4;
    }

    .bio {
      width: 100%;
      min-height: 28px;
      margin: 5px 0 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d0d0d0;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      transform: translateZ(10px);
    }

    .profile-links {
      width: 100%;
      margin-top: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transform: translateZ(14px);
    }

    .profile-spacer { min-height: 0; flex: 0 0 0; }

    .social-link {
      min-width: 0;
      min-height: 38px;
      max-width: 190px;
      flex: 1 1 0;
      padding: 0 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 999px;
      background: rgba(255, 255, 255, .055);
      color: #ececec;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .social-link:last-child:nth-child(odd) { grid-column: 1 / -1; }

    .social-link:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, .23);
      background: rgba(255, 255, 255, .12);
    }

    .social-link:hover .social-icon svg {
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, .68)) drop-shadow(0 0 9px rgba(255, 255, 255, .36));
      transform: scale(1.05);
    }

    .social-icon {
      width: 23px;
      height: 23px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .105);
      color: #fff;
    }

    .social-icon svg {
      width: 16px;
      height: 16px;
      display: block;
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, .52)) drop-shadow(0 0 7px rgba(255, 255, 255, .26));
      transition: filter .22s ease, transform .22s ease;
    }

    .social-name {
      overflow: hidden;
      font-size: 10px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .social-arrow {
      margin-left: 0;
      color: #b8b8b8;
      font-size: 12px;
    }

    .discord-profile {
      width: 100%;
      min-height: 46px;
      margin-top: 7px;
      padding: 5px 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      background: rgba(255, 255, 255, .055);
      color: #ededed;
      text-decoration: none;
      transform: translateZ(14px);
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .discord-profile:hover {
      border-color: rgba(255, 255, 255, .23);
      background: rgba(255, 255, 255, .12);
    }

    .discord-avatar {
      position: relative;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 50%;
      background: #343434;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .discord-avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .discord-identity {
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 3px;
      text-align: center;
    }

    .discord-label {
      color: #a8a8a8;
      font: 8px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .discord-name {
      overflow: hidden;
      color: #f0f0f0;
      font-size: 10px;
      font-weight: 550;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .discord-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #b4b4b4;
      font-size: 9px;
    }

    .discord-status::before {
      width: 11px;
      height: 11px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: linear-gradient(#fff 0 0) center / 6px 2px no-repeat, #f23f43;
      content: "";
    }

    .discord-action {
      margin-left: 0;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      background: rgba(255, 255, 255, .055);
      color: #ddd;
      font-size: 8px;
      white-space: nowrap;
    }

    .track-toggle {
      position: fixed;
      z-index: 4;
      top: 22px;
      right: 24px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 50%;
      background: rgba(36, 36, 36, .72);
      color: #fff;
      cursor: url("./cursor-dot.svg") 12 12, pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform .22s ease, background .22s ease, border-color .22s ease;
    }

    .track-toggle:hover, .track-toggle.playing {
      transform: scale(1.07);
      border-color: rgba(255, 255, 255, .3);
      background: rgba(70, 70, 70, .82);
    }

    .track-toggle span { font-size: 17px; line-height: 1; }

    .track-toggle.playing span { animation: music-pulse .7s ease-in-out infinite alternate; }

    @keyframes music-pulse {
      to { transform: scale(.78); opacity: .55; }
    }

    .view-count {
      position: fixed;
      z-index: 4;
      right: 24px;
      bottom: 20px;
      min-height: 32px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 999px;
      background: rgba(35, 35, 35, .68);
      color: #bcbcbc;
      font: 8px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .view-count strong { color: #f5f5f5; font-weight: 600; letter-spacing: 0; }

    .view-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d4d4d4;
      box-shadow: 0 0 8px rgba(255, 255, 255, .5);
    }

    .entry-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      border: 0;
      background: rgba(174, 174, 174, .16);
      color: #fff;
      cursor: url("./cursor-dot.svg") 12 12, pointer;
      opacity: 1;
      backdrop-filter: blur(20px) saturate(.65);
      -webkit-backdrop-filter: blur(20px) saturate(.65);
      transition: opacity .95s cubic-bezier(.2,.75,.25,1), visibility .95s ease, backdrop-filter .95s ease;
    }

    body.entered .entry-screen {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(0);
      -webkit-backdrop-filter: blur(0);
    }

    .entry-label {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: lowercase;
      text-shadow: 0 1px 22px rgba(0, 0, 0, .3);
      animation: entry-breathe 1.7s ease-in-out infinite alternate;
    }

    @keyframes entry-breathe {
      to { opacity: .5; transform: scale(.97); letter-spacing: .24em; }
    }

    .empty-state {
      grid-column: 1 / -1;
      color: var(--muted);
      text-align: center;
    }

    @media (min-width: 701px) and (max-height: 720px) {
      .profile-grid { padding: 12px 0; gap: 8px; }
      .profile-card { padding: 9px 15px; }
      .avatar { width: 54px; height: 54px; }
      .identity { margin-top: 4px; }
      .identity h2 { font-size: 19px; }
      .badges { min-height: 15px; margin-top: 2px; }
      .badge { min-height: 16px; }
      .profile-location { margin-top: 5px; }
      .bio { min-height: 20px; margin: 4px 0 5px; font-size: 11px; }
      .social-link { min-height: 30px; }
      .social-icon { width: 20px; height: 20px; }
      .social-icon svg { width: 14px; height: 14px; }
      .discord-profile { min-height: 37px; margin-top: 4px; padding: 4px 7px; }
      .discord-avatar { width: 28px; height: 28px; }
      .discord-status { font-size: 8px; }
    }

    @media (max-width: 700px) {
      .profile-grid {
        width: min(590px, calc(100% - 30px));
        padding: 76px 0 68px;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .profile-card { min-height: 306px; }
      .view-count { right: 18px; bottom: 15px; }
      .track-toggle { top: 16px; right: 18px; }
    }

    @media (max-width: 420px) {
      .profile-grid { width: calc(100% - 24px); }
      .profile-card { min-height: 297px; padding: 24px 21px 21px; }
      .track-toggle { width: 38px; height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="profile-grid" id="profile-grid" aria-label="Perfis"></main>

  <button class="track-toggle" id="track-toggle" type="button" aria-label="Ativar música" aria-pressed="false" title="Ativar música">
    <span aria-hidden="true">♫</span>
  </button>

  <div class="view-count" aria-label="Total de visitas">
    <span class="view-dot" aria-hidden="true"></span>
    <strong id="visitor-count" aria-live="polite">—</strong>
    <span>views</span>
  </div>

  <button class="entry-screen" id="entry-screen" type="button" aria-label="Clique para entrar">
    <span class="entry-label">clica</span>
  </button>

  <audio id="custom-music" src="./music.mp3" loop preload="none"></audio>
  <script src="./profiles.js"></script>
  <script>
    const profileGrid = document.querySelector("#profile-grid");
    const profileData = Array.isArray(window.PROFILE_DATA) ? window.PROFILE_DATA : [];
    const visitorCount = document.querySelector("#visitor-count");
    const trackToggle = document.querySelector("#track-toggle");
    const customMusic = document.querySelector("#custom-music");
    const entryScreen = document.querySelector("#entry-screen");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function safeWebUrl(value) {
      const raw = String(value ?? "").trim();
      if (!/^https?:\/\//i.test(raw)) return "";
      try {
        const url = new URL(raw);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function profileCard(profile, index) {
      const name = escapeHtml(profile.name || "Profile");
      const handleValue = String(profile.handle || "").trim();
      const handle = escapeHtml(handleValue && !handleValue.startsWith("@") ? "@" + handleValue : handleValue);
      const bio = escapeHtml(profile.bio || "");
      const photoUrl = safeWebUrl(profile.sitePhoto);
      const initial = escapeHtml((profile.name || "?").trim().charAt(0).toUpperCase());
      const category = String(profile.category || "").trim();
      const badgeValues = Array.isArray(profile.badges) ? profile.badges.slice() : [];
      if (category) badgeValues.unshift(category);
      const badges = '<div class="badges">' + badgeValues.map(value => '<span class="badge">' + escapeHtml(value) + '</span>').join("") + '</div>';
      const location = String(profile.location || "").trim();
      const locationMarkup = location
        ? '<div class="profile-location"><svg class="location-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>' + escapeHtml(location) + '</span></div>'
        : "";

      const socialIcons = {
        instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.6" r=".8" fill="currentColor" stroke="none"/></svg>',
        tiktok: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.2 3h-3.4v11.2a2.4 2.4 0 1 1-2.4-2.4c.4 0 .8.1 1.1.3V8.6a6 6 0 1 0 4.7 5.9V8.8a8.3 8.3 0 0 0 4.1 1.1V6.5A5 5 0 0 1 16.2 3Z"/></svg>',
        roblox: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="m5.2 2.7 16.1 1.5-1.5 16.1-16.1-1.5L5.2 2.7Zm3.9 6-.5 5.2 5.2.5.5-5.2-5.2-.5Z"/></svg>'
      };
      const socials = [
        { name: "Instagram", value: profile.instagram, label: profile.instagramText, icon: socialIcons.instagram },
        { name: "TikTok", value: profile.tiktok, label: profile.tiktokText, icon: socialIcons.tiktok },
        { name: "Roblox", value: profile.roblox, label: profile.robloxText, icon: socialIcons.roblox }
      ].map(item => {
        const href = safeWebUrl(item.value);
        if (!href) return "";
        const label = String(item.label || "").trim();
        const labelMarkup = label ? '<span class="social-name">' + escapeHtml(label) + '</span>' : "";
        return '<a class="social-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(item.name + " de " + name + (label ? ": " + label : "")) + '">' +
          '<span class="social-icon" aria-hidden="true">' + item.icon + '</span>' +
          labelMarkup +
          '<span class="social-arrow" aria-hidden="true">↗</span></a>';
      }).join("");

      const photo = photoUrl ? '<img src="' + escapeHtml(photoUrl) + '" alt="" loading="lazy">' : "";
      const discordNameValue = String(profile.discordName || "").trim();
      const discordUrl = safeWebUrl(profile.discordUrl);
      const discordAvatarUrl = safeWebUrl(profile.discordAvatar);
      const discordStatusValue = String(profile.discordStatus || "").trim();
      const hasDiscord = Boolean(discordNameValue || profile.discordUrl || profile.discordAvatar || discordStatusValue);
      const discordInitial = escapeHtml((discordNameValue || profile.name || "?").trim().charAt(0).toUpperCase());
      const discordAvatarMarkup = discordAvatarUrl ? '<img src="' + escapeHtml(discordAvatarUrl) + '" alt="" loading="lazy">' : "";
      const discordStatusMarkup = discordStatusValue ? '<span class="discord-status">' + escapeHtml(discordStatusValue) + '</span>' : "";
      const discordContent = '<span class="discord-avatar"><span>' + discordInitial + '</span>' + discordAvatarMarkup + '</span>' +
        '<span class="discord-identity"><span class="discord-label">Discord</span><strong class="discord-name">' + escapeHtml(discordNameValue || profile.name || "") + '</strong>' + discordStatusMarkup + '</span>' +
        (discordUrl ? '<span class="discord-action">Profile ↗</span>' : "");
      const discordMarkup = hasDiscord
        ? discordUrl
          ? '<a class="discord-profile" href="' + escapeHtml(discordUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="Perfil Discord de ' + name + '">' + discordContent + '</a>'
          : '<div class="discord-profile">' + discordContent + '</div>'
        : "";
      const delay = Math.min(index * 90, 360);
      return '<article class="profile-card" style="--delay:' + delay + 'ms">' +
        '<div class="avatar"><span>' + initial + '</span>' + photo + '</div>' +
        '<div class="identity"><h2>' + name + '</h2><div class="handle">' + handle + '</div></div>' +
        badges +
        locationMarkup +
        '<p class="bio">' + bio + '</p>' +
        '<div class="profile-spacer"></div>' +
        '<nav class="profile-links" aria-label="Links de ' + name + '">' + socials + '</nav>' +
        discordMarkup +
      '</article>';
    }

    profileGrid.innerHTML = profileData.length
      ? profileData.map(profileCard).join("")
      : '<p class="empty-state">Nenhum perfil configurado.</p>';

    profileGrid.querySelectorAll(".avatar img, .discord-avatar img").forEach(image => {
      image.addEventListener("error", () => image.remove());
    });

    profileGrid.querySelectorAll(".profile-card").forEach(card => {
      card.addEventListener("pointermove", event => {
        if (event.pointerType !== "mouse") return;
        const bounds = card.getBoundingClientRect();
        const x = (event.clientX - bounds.left) / bounds.width;
        const y = (event.clientY - bounds.top) / bounds.height;
        card.style.setProperty("--tilt-x", ((.5 - y) * 12).toFixed(2) + "deg");
        card.style.setProperty("--tilt-y", ((x - .5) * 14).toFixed(2) + "deg");
        card.style.setProperty("--pointer-x", (x * 100).toFixed(1) + "%");
        card.style.setProperty("--pointer-y", (y * 100).toFixed(1) + "%");
      }, { passive: true });

      card.addEventListener("pointerleave", () => {
        card.style.setProperty("--tilt-x", "0deg");
        card.style.setProperty("--tilt-y", "0deg");
        card.style.setProperty("--pointer-x", "50%");
        card.style.setProperty("--pointer-y", "50%");
      }, { passive: true });
    });

    async function updateVisitorCount() {
      const counterApi = "https://page-views-api.ratneshc.com/api/v1";
      const params = new URLSearchParams({ site: "badboys-saddam-profile", path: "/" });
      try {
        const tracked = await fetch(counterApi + "/track?" + params, { mode: "cors", keepalive: true });
        if (!tracked.ok) throw new Error();
        const response = await fetch(counterApi + "/views?" + params, { mode: "cors", cache: "no-store" });
        if (!response.ok) throw new Error();
        const data = await response.json();
        if (!Number.isFinite(data.views)) throw new Error();
        visitorCount.textContent = new Intl.NumberFormat("pt-BR").format(data.views);
      } catch {
        visitorCount.textContent = "—";
      }
    }

    function setMusicState(playing) {
      trackToggle.classList.toggle("playing", playing);
      trackToggle.setAttribute("aria-pressed", String(playing));
      trackToggle.setAttribute("aria-label", playing ? "Pausar música" : "Ativar música");
      trackToggle.setAttribute("title", playing ? "Pausar música" : "Ativar música");
    }

    async function toggleMusic() {
      if (customMusic.paused) {
        try {
          await customMusic.play();
          setMusicState(true);
        } catch {
          setMusicState(false);
        }
      } else {
        customMusic.pause();
        setMusicState(false);
      }
    }

    trackToggle.addEventListener("click", toggleMusic);

    const tabTitle = "crimeonline";
    let titlePosition = 0;
    let erasingTitle = false;

    function animateTabTitle() {
      if (erasingTitle) {
        titlePosition--;
        document.title = titlePosition ? tabTitle.slice(0, titlePosition) : "\u200B";
        if (titlePosition <= 0) {
          titlePosition = 0;
          erasingTitle = false;
          window.setTimeout(animateTabTitle, 450);
          return;
        }
        window.setTimeout(animateTabTitle, 95);
        return;
      }

      titlePosition++;
      document.title = titlePosition ? tabTitle.slice(0, titlePosition) : "\u200B";
      if (titlePosition >= tabTitle.length) {
        erasingTitle = true;
        window.setTimeout(animateTabTitle, 900);
        return;
      }
      window.setTimeout(animateTabTitle, 185);
    }

    window.setTimeout(animateTabTitle, 250);

    entryScreen.addEventListener("click", () => {
      document.body.classList.add("entered");
      customMusic.volume = .38;
      customMusic.play().then(() => setMusicState(true)).catch(() => setMusicState(false));
    }, { once: true });

    updateVisitorCount();
  </script>
</body>
</html>
